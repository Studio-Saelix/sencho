name: Scale benchmark

# Times the busiest read endpoints with 200 deployed stacks and 10 remote
# nodes, and fails when a median regresses against the committed baseline
# (scripts/perf/scale-benchmark-baseline.json) or the run cannot prove it
# measured real work. Timings on shared runners are too noisy to gate every
# pull request, so this runs nightly, on demand, and on pull requests that
# change the benchmark itself.

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/perf/scale-benchmark*'
      - '.github/workflows/scale-benchmark.yml'

permissions:
  contents: read

# A newer push to the same pull request replaces its run; scheduled and manual
# runs never cancel each other.
concurrency:
  group: scale-benchmark-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Scale benchmark (200 stacks, 10 remote nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build (TypeScript)
        working-directory: ./backend
        run: npm run build

      - name: Run benchmark
        env:
          WORK_DIR: ${{ runner.temp }}/scale-benchmark
        run: >-
          node scripts/perf/scale-benchmark.mjs
          --baseline scripts/perf/scale-benchmark-baseline.json
          --out scale-benchmark-results.json
          --work-dir "$WORK_DIR"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scale-benchmark-results
          path: |
            scale-benchmark-results.json
            ${{ runner.temp }}/scale-benchmark/backend.log
          if-no-files-found: ignore
