name: Publish PR Preview Image

# ---------------------------------------------------------------------------
# Preview build  vs  integration (dev)  vs  release
# ---------------------------------------------------------------------------
# Maintainer-triggered Docker Hub images for external validation BEFORE a PR
# merges. Testers pull saelix/sencho:pr-<N> without GHCR credentials. Each
# image is built from the PR's merge commit, the same tree PR CI validates.
#
#   Preview (this file)                  Integration (docker-dev.yml)
#   ---------------------                ---------------------------
#   trigger: workflow_dispatch           trigger: push to main
#   build:  PR merge commit              build: main head
#   registry: Docker Hub only             registry: GHCR only
#   image:  saelix/sencho                 image: ghcr.io/.../sencho-dev
#   tags:   :pr-<N>, :preview-<sha>       tags: :dev, :dev-<sha>
#   signing / SBOM / Release: no          signing / SBOM / Release: no
#   approval gate: preview environment   approval gate: none
#
# Release tags (latest, semver), cosign, SBOM/VEX, and GitHub Releases are
# RELEASE-ONLY in docker-publish.yml. Preview tags never use latest or semver.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build and publish (tags pr-N and preview-sha)'
        required: true
        type: number

concurrency:
  group: docker-preview-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  push_preview_image:
    name: Build and push preview image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN live in the `preview` environment
    # (same Hub repo as production, but no release approval gate). Copy both
    # secrets from the production environment when bootstrapping preview.
    environment: preview
    steps:
      - name: Validate PR number
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || [ "$PR_NUMBER" -lt 1 ]; then
            echo "pr_number must be a positive integer"
            exit 1
          fi

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          state=$(echo "$pr_json" | jq -r '.state')
          head_sha=$(echo "$pr_json" | jq -r '.head.sha')
          base_ref=$(echo "$pr_json" | jq -r '.base.ref')
          mergeable=$(echo "$pr_json" | jq -r '.mergeable')
          if [ "$state" != "open" ]; then
            echo "PR #${PR_NUMBER} is not open (state=${state})"
            exit 1
          fi
          # The preview builds refs/pull/<N>/merge, which does not exist while
          # the PR has conflicts. Fail with the remedy instead of letting the
          # checkout fail on a missing ref.
          if [ "$mergeable" = "false" ]; then
            echo "PR #${PR_NUMBER} conflicts with ${base_ref}; merge ${base_ref} into the branch before publishing a preview"
            exit 1
          fi
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "Building PR #${PR_NUMBER} at ${head_sha}"

      - name: Check out the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the tree GitHub would merge, not the PR head. A head branch
          # can lag behind the base branch and miss dependency fixes already on
          # main, so the Trivy gate fails on code that is not going to land.
          # PR CI checks out the same merge ref, so preview and CI scan the
          # same tree.
          ref: refs/pull/${{ inputs.pr_number }}/merge

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Compute daily apk cache bust value
        id: apk-bust
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Describe the checked-out merge commit. The default workflow context
          # labels a workflow_dispatch build with the default branch head, so
          # preview-<sha> and the OCI revision would name a commit the image
          # does not contain.
          context: git
          images: saelix/sencho
          tags: |
            type=raw,value=pr-${{ inputs.pr_number }}
            type=sha,prefix=preview-,format=short

      - name: Validate preview tags before publish
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${TAGS// }" ]; then
            echo "No tags generated for publish"
            exit 1
          fi
          while IFS= read -r full_ref; do
            [ -n "$full_ref" ] || continue
            tag="${full_ref##*:}"
            if [ "$tag" = "latest" ]; then
              echo "Refusing to publish reserved tag: latest"
              exit 1
            fi
            if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$tag" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "Refusing to publish semver-like tag: ${tag}"
              exit 1
            fi
            if [ "$tag" = "dev" ] || [[ "$tag" == dev-* ]]; then
              echo "Refusing to publish dev integration tag: ${tag}"
              exit 1
            fi
            if [[ "$tag" == "pr-${PR_NUMBER}" ]]; then
              continue
            fi
            if [[ "$tag" =~ ^preview-[0-9a-f]+$ ]]; then
              continue
            fi
            echo "Refusing to publish unexpected tag: ${tag}"
            exit 1
          done <<< "$TAGS"

      # --- Recovery helper image -------------------------------------------
      # The helper is built from the same commit, scanned, smoke tested, and
      # pushed BY DIGEST ONLY before the main image. The main build bakes that
      # digest in as `SENCHO_RECOVERY_HELPER_IMAGE`, so a Sencho image can only
      # ever run the helper built beside it. No tag exists until the main image
      # has passed its own gates: a release that fails a gate leaves no helper
      # tag behind, and a tag could be repointed later where a digest cannot.
      - name: Build recovery helper for scan (amd64, loaded)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker/recovery-helper
          push: false
          load: true
          platforms: linux/amd64
          tags: localhost/sencho-recovery-helper:preview-scan
          cache-from: type=gha,scope=recovery-helper
          cache-to: type=gha,scope=recovery-helper,mode=max

      - name: Scan recovery helper for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: localhost/sencho-recovery-helper:preview-scan
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          trivy-config: trivy-recovery-helper.yaml

      - name: Smoke test recovery helper
        # The image is `FROM scratch`: the only thing to prove is that restic and
        # the identity probe both exec, and that a probe reports a root.
        run: |
          set -euo pipefail
          docker run --rm --network none localhost/sencho-recovery-helper:preview-scan version
          docker run --rm --network none --entrypoint /sencho-recovery-probe \
            localhost/sencho-recovery-helper:preview-scan / | grep -q '"ino"'

      - name: Push recovery helper by digest
        id: helper
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker/recovery-helper
          platforms: linux/amd64,linux/arm64
          # Digest only: `name-canonical` is what lets the tag step below refer to
          # this exact manifest list after the main image has passed its gates.
          outputs: >-
            type=image,
            name=saelix/sencho-recovery-helper,
            push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=recovery-helper
          cache-to: type=gha,scope=recovery-helper,mode=max

      - name: Build preview image for pre-publish scan (amd64, loaded)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: localhost/sencho:preview-scan
          cache-from: type=gha
          build-args: |
            APK_CACHE_BUST=${ steps.apk-bust.outputs.date }
            SENCHO_RECOVERY_HELPER_IMAGE=saelix/sencho-recovery-helper@${ steps.helper.outputs.digest }

      - name: Scan preview image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: localhost/sencho:preview-scan
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          trivy-config: trivy.yaml

      - name: Smoke test preview image (pre-publish)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh localhost/sencho:preview-scan -c \
            'docker --version && docker compose version && git --version'

          docker run -d --name sencho-preview-smoke -p 1852:1852 localhost/sencho:preview-scan
          trap 'docker logs sencho-preview-smoke 2>&1 || true; docker rm -f sencho-preview-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:1852/api/health >/dev/null 2>&1; then
              echo "Container healthy after ${i}s"
              curl -s http://localhost:1852/api/health
              exit 0
            fi
            sleep 1
          done
          echo "FAILED: /api/health did not become ready within 30s"
          exit 1

      - name: Assert the built image pins a recovery helper digest
        run: |
          set -euo pipefail
          baked=$(docker run --rm --entrypoint sh localhost/sencho:preview-scan \
            -c 'printf %s "$SENCHO_RECOVERY_HELPER_IMAGE"')
          case "$baked" in
            *@sha256:*) echo "pinned helper: $baked" ;;
            *) echo "FAILED: baked helper reference is not a digest: '$baked'"; exit 1 ;;
          esac

      - name: Tag the preview recovery helper
        # Preview publishes to Docker Hub only, so the helper stays on Docker Hub
        # too and this workflow needs no GHCR credentials.
        env:
          HELPER_DIGEST: ${{ steps.helper.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [ -n "$HELPER_DIGEST" ] || { echo "FAILED: no helper digest"; exit 1; }
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            helper_tag=$(printf '%s' "$tag" \
              | sed -e 's#^saelix/sencho:#saelix/sencho-recovery-helper:#')
            [ "$helper_tag" != "$tag" ] || { echo "FAILED: unexpected tag $tag"; exit 1; }
            docker buildx imagetools create -t "$helper_tag" \
              "saelix/sencho-recovery-helper@${HELPER_DIGEST}"
          done <<< "$TAGS"

      - name: Build and push preview image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APK_CACHE_BUST=${ steps.apk-bust.outputs.date }
            SENCHO_RECOVERY_HELPER_IMAGE=saelix/sencho-recovery-helper@${ steps.helper.outputs.digest }
